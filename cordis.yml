# dsh-vision 外接视觉插件装载补丁（兼容别名，与 cordis.patch.yml 一致）
# 作为 profile bundle 安装：pnpm 装入 profile 后自动加入 dsh.profile.bundles。
- insert:
    - id: dsh-vision
      name: dsh-vision
      config:
        # Python 解释器；Windows 默认 python，其它平台默认 python3
        python: !!js >
          process.platform === 'win32' ? 'python' : 'python3'
        # 默认识别精度: fast | standard | deep
        precision: standard
        # 单次识别超时（毫秒）
        timeoutMs: 120000
